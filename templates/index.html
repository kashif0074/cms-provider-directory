<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Medicare Provider Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --surface-active: #e2e8f0;
    --border: #e2e8f0;
    --border-subtle: #edf2f7;
    --border-strong: #cbd5e1;
    
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-tertiary: #94a3b8;
    
    --brand: #0284c7;
    --brand-dark: #0369a1;
    --brand-light: #e0f2fe;
    --brand-subtle: #f0f9ff;
    --brand-border: #bae6fd;
    
    --teal: #0d9488;
    --teal-light: #ccfbf1;
    --teal-dark: #115e59;
    
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --danger-border: #fecaca;
    
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    
    --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
    --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Navbar */
  .navbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-xs);
  }
  .nav-inner {
    max-width: 1680px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--teal) 100%);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.22);
    flex-shrink: 0;
  }
  .brand-logo svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  .brand-text h1 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-export {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 7px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-xs);
  }
  .btn-export:hover {
    background: var(--surface-hover);
    color: var(--text-primary);
    border-color: var(--border-strong);
  }
  .btn-export svg { width: 14px; height: 14px; }

  /* Main Container */
  .container {
    max-width: 1680px;
    width: 100%;
    margin: 0 auto;
    padding: 22px 28px 48px;
    flex: 1;
  }

  /* Filter Panel */
  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }

  /* Filter Grid */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 18px;
  }
  .field {
    display: flex;
    flex-direction: column;
  }
  .field label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Multi-Select Component */
  .ms { position: relative; user-select: none; }
  .ms-control {
    min-height: 40px;
    padding: 5px 32px 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: #ffffff;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-xs);
  }
  .ms-control:hover { border-color: var(--border-strong); }
  .ms.open .ms-control {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
  }
  .ms-placeholder { color: var(--text-tertiary); font-size: 13px; font-weight: 400; padding: 3px 4px; }
  .ms-tag {
    background: var(--brand-subtle);
    color: var(--brand-dark);
    font-size: 11.5px;
    font-weight: 600;
    padding: 2.5px 8px;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--brand-border);
  }
  .ms-tag-x {
    cursor: pointer;
    font-weight: 700;
    opacity: 0.65;
    font-size: 13px;
    line-height: 1;
  }
  .ms-tag-x:hover { opacity: 1; color: var(--danger); }
  .ms-arrow {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 10px;
    pointer-events: none;
    transition: transform 0.15s ease;
  }
  .ms.open .ms-arrow { transform: translateY(-50%) rotate(180deg); color: var(--brand); }

  .ms-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 100;
    max-height: 300px;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .ms.open .ms-dropdown { display: flex; }
  .ms-search {
    padding: 10px 14px;
    border: none;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    outline: none;
    font-family: inherit;
    background: #fdfdfd;
  }
  .ms-search:focus { background: #ffffff; }
  .ms-list {
    overflow-y: auto;
    max-height: 210px;
    padding: 5px 0;
  }
  .ms-option {
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--text-primary);
    transition: background 0.1s ease;
  }
  .ms-option:hover { background: var(--surface-hover); }
  .ms-option input[type="checkbox"] {
    accent-color: var(--brand);
    cursor: pointer;
    width: 15px;
    height: 15px;
  }
  .ms-option.checked { background: var(--brand-subtle); color: var(--brand-dark); font-weight: 600; }
  .ms-empty { padding: 16px; font-size: 12.5px; color: var(--text-muted); text-align: center; }
  .ms-custom-btn {
    padding: 9px 14px;
    color: var(--brand);
    font-weight: 600;
    cursor: pointer;
    font-size: 12.5px;
    border-top: 1px dashed var(--border);
    background: #fafafa;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ms-custom-btn:hover { background: var(--brand-light); }

  .ms-actions {
    border-top: 1px solid var(--border);
    padding: 7px 12px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    background: #fafafa;
  }
  .ms-actions button {
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.12s ease;
  }
  .ms-actions button:hover { background: var(--surface-hover); color: var(--text-primary); }

  /* Standard Inputs */
  .field input[type="text"], .field select {
    width: 100%;
    min-height: 40px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    background: #ffffff;
    color: var(--text-primary);
    transition: all 0.15s ease;
    box-shadow: var(--shadow-xs);
  }
  .field input[type="text"]:focus, .field select:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
  }
  .field input::placeholder { color: var(--text-tertiary); }

  /* Filter Footer & Status */
  .filter-panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--border-subtle);
  }
  .filter-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-primary {
    background: var(--brand);
    color: #ffffff;
    border: none;
    padding: 9px 22px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.22);
    transition: all 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--brand-dark);
  }
  .btn-primary:disabled { background: var(--border-strong); cursor: not-allowed; box-shadow: none; }
  
  .btn-secondary {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-xs);
  }
  .btn-secondary:hover { background: var(--surface-hover); color: var(--text-primary); border-color: var(--border-strong); }

  .status-text {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .status-text.error { color: var(--danger); font-weight: 600; }

  /* Table Section */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .table-toolbar {
    padding: 14px 20px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .table-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .table-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .table-scroll {
    max-height: 62vh;
    overflow: auto;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    text-align: left;
  }
  thead th {
    background: #f8fafc;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 12px 14px;
    position: sticky;
    top: 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    z-index: 2;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s ease;
  }
  thead th:hover { background: #f1f5f9; color: var(--text-primary); }
  thead th .sort-icon { margin-left: 5px; opacity: 0.4; font-size: 10px; }
  thead th.sorted { color: var(--brand-dark); }
  thead th.sorted .sort-icon { opacity: 1; color: var(--brand); }
  
  tbody tr {
    cursor: pointer;
    transition: background 0.12s ease;
  }
  tbody tr:nth-child(even) { background-color: #fafbfc; }
  tbody tr:hover { background-color: var(--brand-subtle) !important; }
  
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
    color: var(--text-secondary);
  }
  .name-cell { font-weight: 700; color: var(--text-primary); }
  
  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11.5px;
    font-weight: 600;
    padding: 2.5px 8px;
    border-radius: var(--radius-sm);
    background: var(--surface-hover);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .badge-spec {
    background: #f0fdf4;
    color: #15803d;
    border-color: #bbf7d0;
  }
  .badge-state {
    background: var(--brand-light);
    color: var(--brand-dark);
    border-color: var(--brand-border);
  }
  .badge-th-yes {
    background: var(--teal-light);
    color: var(--teal-dark);
    border-color: #99f6e4;
  }
  .badge-th-no {
    background: #f1f5f9;
    color: #64748b;
    border-color: var(--border);
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Pagination Bar */
  .pagination-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 18px 2px 0;
  }
  .pagination-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-page {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 13px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s ease;
    box-shadow: var(--shadow-xs);
  }
  .btn-page:hover:not(:disabled) {
    background: var(--brand-subtle);
    border-color: var(--brand-border);
    color: var(--brand-dark);
  }
  .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-indicator {
    font-size: 12.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .page-indicator strong { color: var(--text-primary); }
  .page-size-select {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 12.5px;
    background: var(--surface);
    color: var(--text-secondary);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
  }

  /* Empty & Loading States */
  .state-box {
    text-align: center;
    padding: 64px 20px;
    color: var(--text-muted);
  }
  .state-box-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: var(--text-tertiary);
  }
  .state-box h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .state-box p { font-size: 13px; color: var(--text-muted); }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(2px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    gap: 12px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal Details */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: #ffffff;
    border-radius: var(--radius-xl);
    max-width: 680px;
    width: 100%;
    box-shadow: var(--shadow-xl);
    overflow: hidden;
    animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid var(--border);
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.97) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .modal-header-info h3 {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .modal-header-info p {
    font-size: 13px;
    color: var(--brand-dark);
    font-weight: 600;
    margin-top: 2px;
  }
  .modal-close {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .modal-close:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }
  
  .modal-body {
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-height: 68vh;
    overflow-y: auto;
  }
  .modal-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: #fafbfc;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
  }
  .modal-item.full { grid-column: span 2; }
  .modal-item label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }
  .modal-item div {
    font-size: 13.5px;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  .modal-footer {
    padding: 14px 24px;
    background: #f8fafc;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .modal-footer button {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-secondary);
    transition: all 0.12s ease;
  }
  .modal-footer button:hover { background: var(--surface-hover); color: var(--text-primary); }
  .modal-footer button.primary {
    background: var(--brand);
    color: #ffffff;
    border-color: var(--brand);
  }
  .modal-footer button.primary:hover { background: var(--brand-dark); }

  @media (max-width: 900px) {
    .container { padding: 16px; }
    .nav-inner { padding: 12px 16px; }
    .filter-grid { grid-template-columns: 1fr; }
    .modal-body { grid-template-columns: 1fr; }
    .modal-item.full { grid-column: span 1; }
    .pagination-bar { flex-direction: column; align-items: stretch; gap: 14px; }
    .pagination-controls { justify-content: center; }
  }
</style>
</head>
<body>

<!-- Navigation Header -->
<nav class="navbar">
  <div class="nav-inner">
    <div class="brand-group">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M19 10.5h-4.5V6a1.5 1.5 0 0 0-3 0v4.5H7a1.5 1.5 0 0 0 0 3h4.5V18a1.5 1.5 0 0 0 3 0v-4.5H19a1.5 1.5 0 0 0 0-3z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>CMS Medicare Provider Directory</h1>
      </div>
    </div>
    
    <div class="nav-actions">
      <button class="btn-export" onclick="exportData('csv')">

<!-- Provider Details Profile Modal -->
<div class="modal-backdrop" id="providerModal" onclick="closeModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header-info">
        <h3 id="m_name">Provider Name</h3>
        <p id="m_spec">Specialty</p>
      </div>
      <button class="modal-close" onclick="closeModalDirect()" title="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>

      <button onclick="copyNPI()">Copy NPI</button>

<script>
const COLUMNS = [
  { key: "provider_last_name", label: "Last Name", cls: "name-cell" },
  { key: "provider_first_name", label: "First Name" },
  { key: "cred", label: "Cred" },
  { key: "pri_spec", label: "Primary Specialty", badgeSpec: true },
  { key: "sec_spec_all", label: "Secondary Specialties" },
  { key: "facility_name", label: "Facility / Hospital" },
  { key: "adr_ln_1", label: "Address" },
  { key: "citytown", label: "City" },
  { key: "state", label: "State", badgeState: true },
  { key: "zip_code", label: "ZIP" },
  { key: "telephone_number", label: "Phone", cls: "mono" },
  { key: "telehlth", label: "Telehealth", badgeTH: true },
  { key: "npi", label: "NPI", cls: "mono" },
];

let state = {
  page: 1,
  size: 50,
  total: 0,
  pages: 1,
  sortCol: null,
  sortAsc: true,
  currentRecords: [],
};

let optionsData = { states: [], state_details: [], specialties: [] };
const MS_REGISTRY = {};
let currentAbortController = null;
let selectedModalRecord = null;

// MultiSelect Factory Component
function createMultiSelect(containerId, config) {
  const el = document.getElementById(containerId);
  if (!el) return null;

  const ms = {
    id: containerId,
    field: containerId.replace("ms_", ""),
    selected: new Set(),
    options: config.options || [],
    allowCustom: config.allowCustom || false,
    placeholder: config.placeholder || "Select...",
    searchable: config.searchable !== false,
    el: el,
  };

  el.classList.add("ms");
  el.innerHTML = `
    <div class="ms-control" onclick="toggleMS('${containerId}', event)">
      <span class="ms-placeholder">${ms.placeholder}</span>
      <span class="ms-arrow">▼</span>
    </div>
    <div class="ms-dropdown" onclick="event.stopPropagation()">
      ${ms.searchable ? `<input class="ms-search" placeholder="Filter..." oninput="filterMS('${containerId}')" onkeydown="handleMSInputKey('${containerId}', event)">` : ''}
      <div class="ms-list"></div>
      <div class="ms-actions">
        ${ms.options.length ? `<button onclick="selectAllMS('${containerId}')">Select All</button>` : ''}
        <button onclick="clearMS('${containerId}')">Clear</button>
      </div>
    </div>
  `;

  MS_REGISTRY[containerId] = ms;
  renderMS(containerId);
  return ms;
}

function renderMS(id) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;

  const control = ms.el.querySelector(".ms-control");
  const list = ms.el.querySelector(".ms-list");
  const search = ms.el.querySelector(".ms-search");
  const searchVal = search ? search.value.trim().toLowerCase() : "";

  // Render Tags inside Control
  if (ms.selected.size === 0) {
    control.innerHTML = `
      <span class="ms-placeholder">${ms.placeholder}</span>
      <span class="ms-arrow">▼</span>
    `;
  } else {
    const tagsHtml = Array.from(ms.selected).map(v =>
      `<span class="ms-tag">${esc(v)}<span class="ms-tag-x" onclick="removeMS('${id}','${escAttr(v)}');event.stopPropagation();" title="Remove">×</span></span>`
    ).join("");
    control.innerHTML = `${tagsHtml}<span class="ms-arrow">▼</span>`;
  }

  // Filter list
  const visible = ms.options.filter(o => !searchVal || o.toLowerCase().includes(searchVal));

  let listHtml = "";
  if (visible.length === 0 && !ms.allowCustom) {
    listHtml = `<div class="ms-empty">No options</div>`;
  } else {
    listHtml = visible.map(opt => {
      const checked = ms.selected.has(opt);
      return `<label class="ms-option ${checked ? "checked" : ""}" onclick="event.stopPropagation();">
        <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleMSOption('${id}','${escAttr(opt)}')">
        <span>${esc(opt)}</span>
      </label>`;
    }).join("");
  }

  if (ms.allowCustom && searchVal && !ms.options.includes(searchVal.toUpperCase())) {
    listHtml += `<div class="ms-custom-btn" onclick="addCustomMS('${id}')">
      <span>+</span> Add "${esc(search.value.trim())}"
    </div>`;
  }

  list.innerHTML = listHtml;
}

function toggleMS(id, e) {
  e.stopPropagation();
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  const wasOpen = ms.el.classList.contains("open");
  document.querySelectorAll(".ms.open").forEach(x => x.classList.remove("open"));
  if (!wasOpen) {
    ms.el.classList.add("open");
    const s = ms.el.querySelector(".ms-search");
    if (s) {
      s.value = "";
      renderMS(id);
      setTimeout(() => s.focus(), 50);
    }
  }
}

document.addEventListener("click", () => {
  document.querySelectorAll(".ms.open").forEach(x => x.classList.remove("open"));
});

function toggleMSOption(id, val) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  if (ms.selected.has(val)) ms.selected.delete(val);
  else ms.selected.add(val);
  renderMS(id);
}

function removeMS(id, val) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  ms.selected.delete(val);
  renderMS(id);
}

function selectAllMS(id) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  ms.options.forEach(o => ms.selected.add(o));
  renderMS(id);
}

function clearMS(id) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  ms.selected.clear();
  renderMS(id);
}

function filterMS(id) {
  renderMS(id);
}

function handleMSInputKey(id, event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    addCustomMS(id);
  }
}

function handleInputKey(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    triggerSearch(1);
  }
}

function addCustomMS(id) {
  const ms = MS_REGISTRY[id];
  if (!ms) return;
  const search = ms.el.querySelector(".ms-search");
  if (!search) return;
  const val = search.value.trim().toUpperCase();
  if (val) {
    if (!ms.options.includes(val)) {
      ms.options.push(val);
      ms.options.sort();
    }
    ms.selected.add(val);
    search.value = "";
    renderMS(id);
  }
}

function escAttr(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getActiveFilters() {
  const f = {};
  for (const [id, ms] of Object.entries(MS_REGISTRY)) {
    if (ms && ms.selected.size > 0) {
      f[ms.field] = Array.from(ms.selected);
    }
  }

  for (const k of ["provider_last_name", "provider_first_name", "npi", "telehlth"]) {
    const el = document.getElementById("f_" + k);
    if (el) {
      const v = el.value.trim();
      if (v) f[k] = v;
    }
  }
  return f;
}

function clearAllFilters() {
  Object.keys(MS_REGISTRY).forEach(id => {
    MS_REGISTRY[id].selected.clear();
    renderMS(id);
  });
  ["provider_last_name", "provider_first_name", "npi"].forEach(k => {
    const el = document.getElementById("f_" + k);
    if (el) el.value = "";
  });
  const thEl = document.getElementById("f_telehlth");
  if (thEl) thEl.value = "";
  
  state.currentRecords = [];
  state.total = 0;
  state.pages = 1;
  state.page = 1;
  
  document.getElementById("tableBody").innerHTML = "";
  document.getElementById("paginationArea").innerHTML = "";
  document.getElementById("status").innerHTML = "<span>Ready</span>";
  document.getElementById("tableEmptyArea").innerHTML = `
    <div class="state-box">
      <div class="state-box-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3>CMS Provider Search</h3>
      <p>Select your filters above and click Search to query the live CMS database.</p>
    </div>
  `;
}

// Execute Search — triggered on button click or Enter key
async function triggerSearch(page = 1) {
  state.page = page;
  const filters = getActiveFilters();
  const status = document.getElementById("status");
  const loadingOverlay = document.getElementById("loadingOverlay");
  const emptyArea = document.getElementById("tableEmptyArea");
  const tableBody = document.getElementById("tableBody");
  const searchBtn = document.getElementById("searchBtn");

  if (currentAbortController) {
    currentAbortController.abort();
  }
  currentAbortController = new AbortController();

  loadingOverlay.style.display = "flex";
  searchBtn.disabled = true;

  const params = new URLSearchParams();
  for (const [k, v] of Object.entries(filters)) {
    if (Array.isArray(v)) {
      params.set(k, v.join(","));
    } else {
      params.set(k, v);
    }
  }
  params.set("page", state.page);
  params.set("size", state.size);

  const t0 = performance.now();

  try {
    const res = await fetch("/api/search?" + params.toString(), {
      signal: currentAbortController.signal,
    });
    const data = await res.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

    loadingOverlay.style.display = "none";
    searchBtn.disabled = false;

    if (!res.ok) {
      status.className = "status-text error";
      status.textContent = data.error || "Error";
      tableBody.innerHTML = "";
      emptyArea.innerHTML = `
        <div class="state-box">
          <div class="state-box-icon">⚠️</div>
          <h3>Error</h3>
          <p>${esc(data.error || "Please check your query filters.")}</p>
        </div>
      `;
      renderPagination();
      return;
    }

    state.total = data.total;
    state.pages = data.pages;
    state.currentRecords = data.records || [];

    status.className = "status-text";
    status.innerHTML = `<strong>${data.total.toLocaleString()}</strong> matching records (${elapsed}s)`;

    if (!state.currentRecords.length) {
      tableBody.innerHTML = "";
      emptyArea.innerHTML = `
        <div class="state-box">
          <div class="state-box-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <h3>No records found</h3>
          <p>Try adjusting your search criteria.</p>
        </div>
      `;
      renderPagination();
      return;
    }

    emptyArea.innerHTML = "";
    renderTable();
    renderPagination();

  } catch (err) {
    if (err.name === 'AbortError') return;
    loadingOverlay.style.display = "none";
    searchBtn.disabled = false;
    status.className = "status-text error";
    status.textContent = "Network Error: " + err.message;
  }
}

// Table Rendering
function renderTableHeader() {
  const headerRow = document.getElementById("tableHeaderRow");
  headerRow.innerHTML = COLUMNS.map(c => {
    const isSorted = state.sortCol === c.key;
    const arrow = isSorted ? (state.sortAsc ? "▲" : "▼") : "▲▼";
    return `<th class="${isSorted ? 'sorted' : ''}" onclick="sortTable('${c.key}')" title="Sort by ${c.label}">
      ${c.label} <span class="sort-icon">${arrow}</span>
    </th>`;
  }).join("");
}

function sortTable(key) {
  if (state.sortCol === key) {
    state.sortAsc = !state.sortAsc;
  } else {
    state.sortCol = key;
    state.sortAsc = true;
  }
  renderTableHeader();
  renderTable();
}

function renderTable() {
  const tableBody = document.getElementById("tableBody");
  let records = [...state.currentRecords];

  if (state.sortCol) {
    records.sort((a, b) => {
      const va = String(a[state.sortCol] ?? "").toLowerCase();
      const vb = String(b[state.sortCol] ?? "").toLowerCase();
      return state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  tableBody.innerHTML = records.map((r, idx) => {
    const cells = COLUMNS.map(c => {
      const val = r[c.key] ?? "";
      let content = esc(val);
      let cls = c.cls || "";
      if (c.badgeSpec && val) content = `<span class="badge badge-spec">${esc(val)}</span>`;
      if (c.badgeState && val) content = `<span class="badge badge-state">${esc(val)}</span>`;
      if (c.badgeTH) {
        content = val === "Y"
          ? `<span class="badge badge-th-yes">Yes</span>`
          : `<span class="badge badge-th-no">No</span>`;
      }
      return `<td class="${cls}" title="${esc(val)}">${content}</td>`;
    }).join("");

    return `<tr onclick="openModal(${idx})">${cells}</tr>`;
  }).join("");
}

// Pagination Controls
function renderPagination() {
  const p = state.page, pages = state.pages, total = state.total;
  const start = total ? (p - 1) * state.size + 1 : 0;
  const end = Math.min(p * state.size, total);
  const container = document.getElementById("paginationArea");

  if (!total) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = `
    <div class="pagination-bar">
      <div class="page-indicator">
        Showing <strong>${start.toLocaleString()}–${end.toLocaleString()}</strong> of <strong>${total.toLocaleString()}</strong> · Page <strong>${p}</strong> of <strong>${pages.toLocaleString()}</strong>
      </div>
      
      <div class="pagination-controls">
        <button class="btn-page" onclick="triggerSearch(1)" ${p === 1 ? "disabled" : ""}>« First</button>
        <button class="btn-page" onclick="triggerSearch(${p - 1})" ${p === 1 ? "disabled" : ""}>‹ Prev</button>
        <button class="btn-page" onclick="triggerSearch(${p + 1})" ${p >= pages ? "disabled" : ""}>Next ›</button>
        <button class="btn-page" onclick="triggerSearch(${pages})" ${p >= pages ? "disabled" : ""}>Last »</button>
        
        <select class="page-size-select" onchange="changeSize(this.value)">
          <option value="25"  ${state.size===25?"selected":""}>25 / page</option>
          <option value="50"  ${state.size===50?"selected":""}>50 / page</option>
          <option value="100" ${state.size===100?"selected":""}>100 / page</option>
          <option value="200" ${state.size===200?"selected":""}>200 / page</option>
        </select>
      </div>
    </div>
  `;
}

function changeSize(s) {
  state.size = parseInt(s);
  triggerSearch(1);
}

// Modal Provider Profile
function openModal(index) {
  const record = state.currentRecords[index];
  if (!record) return;
  selectedModalRecord = record;

  const fullName = `${record.provider_first_name || ""} ${record.provider_last_name || ""} ${record.cred || ""}`.trim() || "Provider Profile";
  document.getElementById("m_name").textContent = fullName;
  document.getElementById("m_spec").textContent = record.pri_spec || "";

  const fields = [
    { label: "NPI Number", val: record.npi, full: false },
    { label: "Credentials", val: record.cred || "—", full: false },
    { label: "Primary Specialty", val: record.pri_spec, full: true },
    { label: "Secondary Specialties", val: record.sec_spec_all || "—", full: true },
    { label: "Facility Name", val: record.facility_name || "—", full: true },
    { label: "Address", val: record.adr_ln_1, full: true },
    { label: "City / Town", val: record.citytown, full: false },
    { label: "State", val: record.state, full: false },
    { label: "ZIP Code", val: record.zip_code, full: false },
    { label: "Phone Number", val: record.telephone_number || "—", full: false },
    { label: "Telehealth Services", val: record.telehlth === "Y" ? "Yes" : "No", full: false },
  ];

  document.getElementById("modalBody").innerHTML = fields.map(f => `
    <div class="modal-item ${f.full ? 'full' : ''}">
      <label>${esc(f.label)}</label>
      <div>${esc(f.val || "—")}</div>
    </div>
  `).join("");

  document.getElementById("providerModal").classList.add("open");
}

function closeModal(e) {
  if (e.target.id === "providerModal") closeModalDirect();
}

function closeModalDirect() {
  document.getElementById("providerModal").classList.remove("open");
}

function copyNPI() {
  if (selectedModalRecord && selectedModalRecord.npi) {
    navigator.clipboard.writeText(selectedModalRecord.npi);
    alert("NPI copied: " + selectedModalRecord.npi);
  }
}

function exportData(format) {
  const filters = getActiveFilters();
  const params = new URLSearchParams();
  for (const [k, v] of Object.entries(filters)) {
    if (Array.isArray(v)) params.set(k, v.join(","));
    else params.set(k, v);
  }
  params.set("format", format);
  params.set("limit", "500");
  window.open("/api/export?" + params.toString(), "_blank");
}

// App Initialization
async function initApp() {
  renderTableHeader();
  try {
    const res = await fetch("/api/options");
    optionsData = await res.json();
  } catch (e) {
    console.error("Options fetch error:", e);
  }

  createMultiSelect("ms_state", {
    options: optionsData.states || [],
    placeholder: "Select...",
    allowCustom: false,
  });

  createMultiSelect("ms_pri_spec", {
    options: optionsData.specialties || [],
    placeholder: "Select...",
    allowCustom: true,
  });

  createMultiSelect("ms_sec_spec_all", {
    options: optionsData.specialties || [],
    placeholder: "Select...",
    allowCustom: true,
  });

  createMultiSelect("ms_citytown", {
    options: ["BOSTON", "CAMBRIDGE", "NEW YORK", "LOS ANGELES", "CHICAGO", "HOUSTON", "DALLAS", "MIAMI", "SEATTLE", "SAN FRANCISCO", "PHILADELPHIA", "ATLANTA"],
    placeholder: "Select or type...",
    allowCustom: true,
  });

  createMultiSelect("ms_facility_name", {
    options: [],
    placeholder: "Select or type...",
    allowCustom: true,
  });

  createMultiSelect("ms_zip_code", {
    options: [],
    placeholder: "Select or type...",
    allowCustom: true,
  });
  
  // NOTE: triggerSearch(1) is NOT called here on initial page load.
  // Searches are only triggered when the user explicitly clicks the Search button (or presses Enter).
}

// Run on page load
initApp();
</script>
